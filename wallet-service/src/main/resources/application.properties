spring.datasource.url=jdbc:mysql://localhost:3306/trade_walletservice?serverTimezone=GMT%2B8&characterEncoding=utf-8&useSSL=false
spring.datasource.username=root
spring.datasource.password=0000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#mybatis-plus.type-enums-package=com.exchange.app.wallet.po

server.port=8082
grpc.server.port=9092

grpc.client.GLOBAL.enable-keep-alive=true
grpc.client.GLOBAL.negotiation-type=plaintext
grpc.client.ledger-client.address=static://127.0.0.1:9091
grpc.client.account-client.address=static://127.0.0.1:9091

spring.kafka.bootstrap-servers=192.168.52.100:9092
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.fetch-min-size=256
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual
spring.kafka.listener.type=single
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.compression-type=lz4
spring.kafka.producer.retries=5
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer