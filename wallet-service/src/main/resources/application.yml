spring:
  application:
    name: wallet-service

  profiles:
    default: cloud

  datasource:
    url: "jdbc:mysql://localhost:3306/trade_walletservice?serverTimezone=GMT%2B8&characterEncoding=utf-8&useSSL=false"
    username: root
    password: "0000"
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Ledger and wallet share a MySQL max_connections budget of 50. The wallet cap of 12,
    # together with ledger's cap of 32, leaves six connections for operations and auxiliary clients.
    hikari:
      maximum-pool-size: ${WALLET_DB_MAX_POOL_SIZE:12}
      minimum-idle: ${WALLET_DB_MIN_IDLE:8}
      connection-timeout: ${WALLET_DB_CONNECTION_TIMEOUT_MS:2000}
      validation-timeout: ${WALLET_DB_VALIDATION_TIMEOUT_MS:1000}
      max-lifetime: ${WALLET_DB_MAX_LIFETIME_MS:1500000}
      keepalive-time: ${WALLET_DB_KEEPALIVE_TIME_MS:300000}
      # Driver timeouts bound connection establishment and socket reads independently of
      # Hikari's pool-acquisition timeout.
      data-source-properties:
        connectTimeout: ${WALLET_DB_CONNECT_TIMEOUT_MS:2000}
        socketTimeout: ${WALLET_DB_SOCKET_TIMEOUT_MS:5000}

  cache:
    type: redis
  redis:
    port: 6379

  kafka:
    consumer:
      auto-offset-reset: latest
      fetch-min-size: 256
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer

    listener:
      ack-mode: manual
      type: single

    producer:
      compression-type: lz4
      retries: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

      properties:
        enable:
          idempotence: true


server:
  port: 8082


grpc:
  server:
    port: 9192

  client:
    GLOBAL:
      enable-keep-alive: true
      negotiation-type: plaintext

    ledger-client:
      address: static://127.0.0.1:9191

    account-client:
      address: static://127.0.0.1:9191

mybatis-plus:
  configuration:
    # Bound mapper execution so a slow statement cannot retain a shared DB connection indefinitely.
    default-statement-timeout: ${WALLET_DB_STATEMENT_TIMEOUT_SECONDS:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        zexchange.grpc.server.duration: true
        zexchange.wallet.processing.duration: true
        zexchange.redis.operation.duration: true
        zexchange.db.operation.duration: true
        zexchange.db.transaction.duration: true
      slo:
        zexchange.grpc.server.duration: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,3s
        zexchange.wallet.processing.duration: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,3s
        zexchange.redis.operation.duration: 1ms,2ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s
        zexchange.db.operation.duration: 1ms,2ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,3s
        zexchange.db.transaction.duration: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,3s,10s

app:
  kafka:
    not-retriable-exceptions: com.exchange.common.exception.AbnormalProtoDataException
    listener:
      retry:
        attempts: 7
        backoff-delay-ms: 1000
        backoff-multiplier: 1.0
        backoff-max-delay-ms: 25000
        auto-create-topics: false

  outbox:
    interval: "*/5 * * * * ?"
    page-limit: 2

  cache:
    idemp:
      pending-ttl: 120s
      done-ttl: 24h
      jitter-ms: 100
    data:
      entity-cache-ttl: 120s
      index-cache-ttl: 1h
      tombstone-ttl: 120s # should be short to only cover request ttl
      negative-ttl: 30s
      jitter: 100ms
