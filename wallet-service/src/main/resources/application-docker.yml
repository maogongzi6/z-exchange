spring:
  datasource:
    url: "jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:trade_walletservice}?serverTimezone=GMT%2B8&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true"
    username: ${DB_USERNAME:wallet}
    password: ${DB_PASSWORD:wallet-local}

  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

grpc:
  client:
    ledger-client:
      address: ${LEDGER_GRPC_ADDRESS:static://ledger-service:9191}
    account-client:
      address: ${ACCOUNT_GRPC_ADDRESS:static://ledger-service:9191}
