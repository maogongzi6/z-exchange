server:
  port: 10020


grpc:
  client:
    GLOBAL:
      enable-keep-alive: true
      negotiation-type: plaintext
      address: static://127.0.0.1:9091


spring:
  datasource:
    url: "jdbc:mysql://localhost:3306/trade_walletservice?serverTimezone=GMT%2B8&characterEncoding=utf-8&useSSL=false&rewriteBatchedStatements=true"
    username: root
    password: "0000"
    driver-class-name: com.mysql.cj.jdbc.Driver

  cache:
    type: redis
  redis:
    host: 192.168.52.100
    port: 6379

  kafka:
    bootstrap-servers: 192.168.52.100:9092

    consumer:
      auto-offset-reset: latest
      fetch-min-size: 256
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer

    listener:
      ack-mode: manual
      type: single

    producer:
      compression-type: lz4
      retries: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

      properties:
        enable:
          idempotence: true


mybatis-plus:
  type-enums-package: com.exchange.app.wallet.po


app:
  kafka:
    not-retriable-exceptions: >
      com.exchange.app.wallet.exception.AbnormalProtoDataException,
      java.lang.RuntimeException

  outbox:
    interval: "*/5 * * * * ?"
    page-limit: 2

  cache:
    idemp:
      pending-ttl: 120s
      done-ttl: 24h
      jitter-ms: 100