syntax = "proto3";

package ledger;

option java_multiple_files = true;
option java_package = "com.exchange.proto.ledger.post";

import "com/exchange/proto/ledger/ledger_common.proto";
import "com/exchange/proto/common/error.proto";

service PostService {
  rpc postTransaction(PostTransactionRequestPb) returns (PostTransactionReplyPb) {}
  rpc getTxnById(GetTxnByIdRequestPb) returns (GetTxnReplyPb);
  rpc getTxnByRefId(GetTxnByRefIdRequestPb) returns (GetTxnReplyPb);
}

message PostTransactionRequestPb {
  string referenceId = 1;
  string description = 2;
  repeated LedgerEntryPb entries = 3;
}

message PostTransactionReplyPb {
  string referenceId = 1;
  string ledgerTxnId = 2;
  common.ErrorPb error = 3;
}

message GetTxnByIdRequestPb {
  string ledgerTxnId = 1;     // maps to ledger_transactions.txn_id
  bool includeEntries = 2;    // when true, return ledger_entries for this txn_id
}

message GetTxnByRefIdRequestPb {
  string referenceId = 1;     // maps to ledger_transactions.reference_id
  bool includeEntries = 2;    // when true, return ledger_entries for the found txn
}

message GetTxnReplyPb {
  LedgerTransactionPb transaction = 1;
  repeated LedgerEntryPb entries = 2; // present when includeEntries=true and txn found
  common.ErrorPb error = 3;
}

// Mirrors ledger_transactions (txn_id, reference_id, extra_data)
message LedgerTransactionPb {
  string ledgerTxnId = 1;   // ledger_transactions.txn_id
  string referenceId = 2;   // ledger_transactions.reference_id
  string extraData = 3;     // ledger_transactions.extra_data (typically JSON/text)
}

message LedgerEntryPb {
  string ledgerEntryId = 1;
  string accountRef = 2;
  LedgerDirectionPb direction = 3;
  int64 amount = 4;
  string assetId = 5;
}