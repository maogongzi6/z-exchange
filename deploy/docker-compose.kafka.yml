services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: kafka
    restart: unless-stopped
    # Environment values override these defaults. The limit is a hard cap for
    # the whole container; the reservation is a soft target, not extra memory.
    mem_limit: ${KAFKA_MEMORY_LIMIT:-3072m}
    mem_reservation: ${KAFKA_MEMORY_RESERVATION:-2048m}
    ports:
      - "${KAFKA_PRIVATE_IP:-172.31.28.6}:${KAFKA_EXTERNAL_PORT:-9092}:9092"
    environment:
      # JVM heap is part of mem_limit. The remainder is available for metaspace,
      # thread stacks, direct/native buffers, and container-accounted page cache.
      KAFKA_HEAP_OPTS: "${KAFKA_HEAP_OPTS:--Xms1g -Xmx1g}"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      # VPC clients use the host's private address; containers in this stack use INTERNAL.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_PRIVATE_IP:-172.31.28.6}:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  # This short-lived initializer waits for a healthy broker, idempotently
  # creates missing base/retry/DLT topics, lists them, and exits successfully.
  # It never deletes topics or messages and is not restarted after completion.
  kafka-topic-init:
    image: apache/kafka:3.8.1
    container_name: kafka-topic-init
    restart: "no"
    # This separate budget is used only while topic initialization is running;
    # its JVM heap is included in this container's hard memory limit.
    mem_limit: ${KAFKA_TOPIC_INIT_MEMORY_LIMIT:-256m}
    mem_reservation: ${KAFKA_TOPIC_INIT_MEMORY_RESERVATION:-64m}
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_HEAP_OPTS: "${KAFKA_TOPIC_INIT_HEAP_OPTS:--Xms64m -Xmx128m}"
      KAFKA_BOOTSTRAP_SERVER: kafka:29092
      KAFKA_BASE_TOPICS: ${KAFKA_BASE_TOPICS:-wallet.ledger.command.posting,ledger.wallet.reply.posting}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_TOPIC_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-1}
      # Seven total listener attempts produce six Spring Kafka retry topics.
      KAFKA_RETRY_TOPIC_COUNT: ${KAFKA_RETRY_TOPIC_COUNT:-6}
    volumes:
      - ../standard/docker/kafka/create-topics.sh:/opt/z-exchange/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/opt/z-exchange/create-topics.sh"]

volumes:
  kafka-data:
