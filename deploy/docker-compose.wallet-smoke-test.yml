services:
  wallet-smoke-test:
    build:
      context: ..
      dockerfile: stress-test/Dockerfile
    image: z-exchange/stress-test:local
    container_name: wallet-smoke-test
    entrypoint: ["/run-wallet-smoke.sh"]
    environment:
      WALLET_GRPC_HOST: ${WALLET_GRPC_HOST:-172.31.23.255}
      WALLET_GRPC_PORT: ${WALLET_GRPC_PORT:-9192}
      WALLET_GRPC_DEADLINE_SECONDS: ${WALLET_GRPC_DEADLINE_SECONDS:-5}
      WALLET_SMOKE_SETTLEMENT_TIMEOUT_SECONDS: ${WALLET_SMOKE_SETTLEMENT_TIMEOUT_SECONDS:-20}
      WALLET_SMOKE_POLL_INTERVAL_SECONDS: ${WALLET_SMOKE_POLL_INTERVAL_SECONDS:-0.25}
      WALLET_SMOKE_INITIAL_BALANCE: ${WALLET_SMOKE_INITIAL_BALANCE:-1000}
      WALLET_SMOKE_RESERVE_AMOUNT: ${WALLET_SMOKE_RESERVE_AMOUNT:-100}
      WALLET_SMOKE_ATOMIC_AMOUNT: ${WALLET_SMOKE_ATOMIC_AMOUNT:-25}
      WALLET_SMOKE_RUN_ID: ${WALLET_SMOKE_RUN_ID:-}
      DB_HOST: ${INFRA_PRIVATE_IP:-172.31.18.211}
      DB_PORT: ${DB_PORT:-3306}
      WALLET_DB_NAME: ${WALLET_DB_NAME:-trade_walletservice}
      WALLET_DB_USERNAME: ${WALLET_DB_USERNAME:-wallet}
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD:-wallet-local}
      LEDGER_DB_NAME: ${LEDGER_DB_NAME:-trade_ledgerservice}
      LEDGER_DB_USERNAME: ${LEDGER_DB_USERNAME:-ledger}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:-ledger-local}
      DB_READY_ATTEMPTS: ${DB_READY_ATTEMPTS:-30}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
      K6_OUT: ${K6_OUT:-experimental-prometheus-rw}
      K6_PROMETHEUS_RW_SERVER_URL: ${K6_PROMETHEUS_RW_SERVER_URL:-http://172.31.28.170:9290/api/v1/write}
      K6_PROMETHEUS_RW_TREND_STATS: ${K6_PROMETHEUS_RW_TREND_STATS:-p(95),p(99),max}
