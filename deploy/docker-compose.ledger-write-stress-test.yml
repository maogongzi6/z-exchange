services:
  ledger-write-stress-test:
    build:
      context: ..
      dockerfile: stress-test/Dockerfile
    image: z-exchange/stress-test:local
    container_name: ledger-write-stress-test
    entrypoint: ["/run-write-stress.sh"]
    environment:
      LEDGER_GRPC_HOST: ${LEDGER_GRPC_HOST:-172.31.16.37}
      LEDGER_GRPC_PORT: ${LEDGER_GRPC_PORT:-9191}
      LEDGER_GRPC_DEADLINE_SECONDS: ${LEDGER_GRPC_DEADLINE_SECONDS:-5}
      LEDGER_STRESS_PROFILE: ${LEDGER_STRESS_PROFILE:-discovery}
      LEDGER_STRESS_RUN_ID: ${LEDGER_STRESS_RUN_ID:-}
      LEDGER_STRESS_TRUNCATE_DB_BEFORE_RUN: ${LEDGER_STRESS_TRUNCATE_DB_BEFORE_RUN:-false}
      LEDGER_STRESS_WARM_RATE: ${LEDGER_STRESS_WARM_RATE:-5}
      LEDGER_STRESS_STAGE_SECONDS: ${LEDGER_STRESS_STAGE_SECONDS:-30}
      LEDGER_STRESS_DISCOVERY_RATE_STEP: ${LEDGER_STRESS_DISCOVERY_RATE_STEP:-10}
      LEDGER_STRESS_DISCOVERY_STEPS: ${LEDGER_STRESS_DISCOVERY_STEPS:-8}
      LEDGER_STRESS_SUSTAINABLE_RATE: ${LEDGER_STRESS_SUSTAINABLE_RATE:-50}
      LEDGER_STRESS_RECOVERY_OBSERVATION_SECONDS: ${LEDGER_STRESS_RECOVERY_OBSERVATION_SECONDS:-60}
      LEDGER_STRESS_SOAK_SECONDS: ${LEDGER_STRESS_SOAK_SECONDS:-120}
      LEDGER_STRESS_PREALLOCATED_VUS: ${LEDGER_STRESS_PREALLOCATED_VUS:-100}
      LEDGER_STRESS_MAX_VUS: ${LEDGER_STRESS_MAX_VUS:-500}
      LEDGER_DUPLICATE_DELAY_SECONDS: ${LEDGER_DUPLICATE_DELAY_SECONDS:-5}
      LEDGER_STRESS_BASE_AMOUNT: ${LEDGER_STRESS_BASE_AMOUNT:-100}
      LEDGER_STRESS_AMOUNT_SPAN: ${LEDGER_STRESS_AMOUNT_SPAN:-900}
      LEDGER_STRESS_BIG_TXN_PERCENT: ${LEDGER_STRESS_BIG_TXN_PERCENT:-10}
      LEDGER_STRESS_MAX_UNEXPECTED_ERROR_RATE: ${LEDGER_STRESS_MAX_UNEXPECTED_ERROR_RATE:-}
      LEDGER_STRESS_MAX_P95_MS: ${LEDGER_STRESS_MAX_P95_MS:-}
      DB_HOST: ${INFRA_PRIVATE_IP:-172.31.18.211}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${LEDGER_DB_NAME:-trade_ledgerservice}
      DB_USERNAME: ${LEDGER_DB_USERNAME:-ledger}
      DB_PASSWORD: ${LEDGER_DB_PASSWORD:-ledger-local}
      DB_READY_ATTEMPTS: ${DB_READY_ATTEMPTS:-30}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
      K6_OUT: ${K6_OUT:-experimental-prometheus-rw}
      K6_PROMETHEUS_RW_SERVER_URL: ${K6_PROMETHEUS_RW_SERVER_URL:-http://172.31.28.170:9290/api/v1/write}
      K6_PROMETHEUS_RW_TREND_STATS: ${K6_PROMETHEUS_RW_TREND_STATS:-p(95),p(99),max}
