services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    mem_limit: ${MYSQL_MEMORY_LIMIT:-2560m}
    mem_reservation: ${MYSQL_MEMORY_RESERVATION:-2048m}
    environment:
      MYSQL_DATABASE: trade_ledgerservice
      MYSQL_USER: ${LEDGER_DB_USERNAME:-ledger}
      MYSQL_PASSWORD: ${LEDGER_DB_PASSWORD:-ledger-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local}
      WALLET_DB_USERNAME: ${WALLET_DB_USERNAME:-wallet}
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD:-wallet-local}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --performance-schema=ON
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-1536M}
      - --max-connections=80
    ports:
      - "${INFRA_PRIVATE_IP:-172.31.18.211}:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../standard/sql/ledger_service.sql:/docker-entrypoint-initdb.d/001-ledger-service.sql:ro
      - ../standard/sql/wallet_service.sql:/docker-entrypoint-initdb.d/002-wallet-service.sql:ro
      - ../standard/docker/mysql/grant-service-users.sh:/docker-entrypoint-initdb.d/003-grant-service-users.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:8.4
    container_name: redis
    restart: unless-stopped
    mem_limit: ${REDIS_MEMORY_LIMIT:-512m}
    mem_reservation: ${REDIS_MEMORY_RESERVATION:-256m}
    # Redis is an acceleration tier; MySQL remains the durable source of truth.
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory", "${REDIS_MAXMEMORY:-384mb}", "--maxmemory-policy", "allkeys-lfu"]
    ports:
      - "${INFRA_PRIVATE_IP:-172.31.18.211}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
