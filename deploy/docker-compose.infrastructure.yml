services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    mem_limit: ${MYSQL_MEMORY_LIMIT:-1792m}
    mem_reservation: ${MYSQL_MEMORY_RESERVATION:-1280m}
    environment:
      MYSQL_DATABASE: trade_ledgerservice
      MYSQL_USER: ${LEDGER_DB_USERNAME:-ledger}
      MYSQL_PASSWORD: ${LEDGER_DB_PASSWORD:-ledger-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --performance-schema=ON
      - --innodb-buffer-pool-size=640M
      - --max-connections=50
    ports:
      - "${INFRA_PRIVATE_IP:-172.31.18.211}:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../standard/sql/ledger_service.sql:/docker-entrypoint-initdb.d/001-ledger-service.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:8.4
    container_name: redis
    restart: unless-stopped
    mem_limit: ${REDIS_MEMORY_LIMIT:-384m}
    mem_reservation: ${REDIS_MEMORY_RESERVATION:-256m}
    # Redis is an acceleration tier; MySQL remains the durable source of truth.
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lfu"]
    ports:
      - "${INFRA_PRIVATE_IP:-172.31.18.211}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.1
    container_name: kafka
    restart: unless-stopped
    mem_limit: ${KAFKA_MEMORY_LIMIT:-896m}
    mem_reservation: ${KAFKA_MEMORY_RESERVATION:-512m}
    ports:
      - "${INFRA_PRIVATE_IP:-172.31.18.211}:${KAFKA_EXTERNAL_PORT:-9092}:9092"
    environment:
      KAFKA_HEAP_OPTS: "${KAFKA_HEAP_OPTS:--Xms512m -Xmx512m}"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${INFRA_PRIVATE_IP:-172.31.18.211}:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

volumes:
  mysql-data:
