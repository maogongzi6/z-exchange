services:
  ledger-service:
    build:
      context: ..
      dockerfile: ledger-service/Dockerfile
    image: z-exchange/ledger-service:local
    container_name: ledger-service
    restart: unless-stopped
    mem_limit: ${LEDGER_MEMORY_LIMIT:-3g}
    mem_reservation: ${LEDGER_MEMORY_RESERVATION:-2g}
    environment:
      JAVA_TOOL_OPTIONS: "${LEDGER_JAVA_TOOL_OPTIONS:--Xms1g -Xmx2g}"
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: ${INFRA_PRIVATE_IP:-172.31.18.211}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${LEDGER_DB_NAME:-trade_ledgerservice}
      DB_USERNAME: ${LEDGER_DB_USERNAME:-ledger}
      DB_PASSWORD: ${LEDGER_DB_PASSWORD:-ledger-local}
      REDIS_HOST: ${INFRA_PRIVATE_IP:-172.31.18.211}
      REDIS_PORT: ${REDIS_PORT:-6379}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-TODO_SET_KAFKA_PRIVATE_IP:9092}
    ports:
      - "${LEDGER_PRIVATE_IP:-172.31.16.37}:8081:8081"
      - "${LEDGER_PRIVATE_IP:-172.31.16.37}:9191:9191"
    volumes:
      - ledger-service-logs:/app/logs/ledger-service

volumes:
  ledger-service-logs:
