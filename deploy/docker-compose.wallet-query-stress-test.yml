services:
  wallet-query-stress-test:
    build:
      context: ..
      dockerfile: stress-test/Dockerfile
    image: z-exchange/stress-test:local
    container_name: wallet-query-stress-test
    entrypoint: ["/run-wallet-query-stress.sh"]
    environment:
      WALLET_GRPC_HOST: ${WALLET_GRPC_HOST:-172.31.23.255}
      WALLET_GRPC_PORT: ${WALLET_GRPC_PORT:-9192}
      WALLET_GRPC_DEADLINE_SECONDS: ${WALLET_GRPC_DEADLINE_SECONDS:-5}
      WALLET_QUERY_PROFILE: ${WALLET_QUERY_PROFILE:-rpc-discovery}
      WALLET_QUERY_LOOKUP: ${WALLET_QUERY_LOOKUP:-wallet-id}
      WALLET_QUERY_RUN_ID: ${WALLET_QUERY_RUN_ID:-}
      WALLET_QUERY_FIXTURE_SIZE: ${WALLET_QUERY_FIXTURE_SIZE:-10000}
      WALLET_QUERY_WORKING_SET_SIZE: ${WALLET_QUERY_WORKING_SET_SIZE:-1000}
      WALLET_QUERY_WORKING_SET_START: ${WALLET_QUERY_WORKING_SET_START:-100}
      WALLET_QUERY_WORKING_SET_STEP: ${WALLET_QUERY_WORKING_SET_STEP:-100}
      WALLET_QUERY_WORKING_SET_STEPS: ${WALLET_QUERY_WORKING_SET_STEPS:-8}
      WALLET_QUERY_STAGE_SECONDS: ${WALLET_QUERY_STAGE_SECONDS:-30}
      WALLET_QUERY_WARM_RATE: ${WALLET_QUERY_WARM_RATE:-5}
      WALLET_QUERY_RATE: ${WALLET_QUERY_RATE:-100}
      WALLET_QUERY_RATE_STEP: ${WALLET_QUERY_RATE_STEP:-25}
      WALLET_QUERY_RATE_STEPS: ${WALLET_QUERY_RATE_STEPS:-8}
      WALLET_QUERY_SOAK_SECONDS: ${WALLET_QUERY_SOAK_SECONDS:-1800}
      WALLET_QUERY_PREALLOCATED_VUS: ${WALLET_QUERY_PREALLOCATED_VUS:-100}
      WALLET_QUERY_MAX_VUS: ${WALLET_QUERY_MAX_VUS:-500}
      WALLET_QUERY_HIT_RATE_PERCENT: ${WALLET_QUERY_HIT_RATE_PERCENT:-100}
      WALLET_QUERY_MISS_CARDINALITY_PERCENT: ${WALLET_QUERY_MISS_CARDINALITY_PERCENT:-10}
      WALLET_QUERY_MISS_PATTERN: ${WALLET_QUERY_MISS_PATTERN:-repeated}
      WALLET_QUERY_OWNER_TYPE: ${WALLET_QUERY_OWNER_TYPE:-user}
      WALLET_QUERY_SYSTEM_PERCENT: ${WALLET_QUERY_SYSTEM_PERCENT:-50}
      WALLET_QUERY_MAX_UNEXPECTED_ERROR_RATE: ${WALLET_QUERY_MAX_UNEXPECTED_ERROR_RATE:-}
      WALLET_QUERY_MAX_P95_MS: ${WALLET_QUERY_MAX_P95_MS:-}
      WALLET_STRESS_TRUNCATE_DB_BEFORE_RUN: ${WALLET_STRESS_TRUNCATE_DB_BEFORE_RUN:-false}
      WALLET_STRESS_TRUNCATE_CACHE_BEFORE_RUN: ${WALLET_STRESS_TRUNCATE_CACHE_BEFORE_RUN:-false}
      DB_HOST: ${INFRA_PRIVATE_IP:-172.31.18.211}
      DB_PORT: ${DB_PORT:-3306}
      WALLET_DB_NAME: ${WALLET_DB_NAME:-trade_walletservice}
      WALLET_DB_USERNAME: ${WALLET_DB_USERNAME:-wallet}
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD:-wallet-local}
      DB_READY_ATTEMPTS: ${DB_READY_ATTEMPTS:-30}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
      REDIS_HOST: ${INFRA_PRIVATE_IP:-172.31.18.211}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_READY_ATTEMPTS: ${REDIS_READY_ATTEMPTS:-30}
      K6_OUT: ${K6_OUT:-experimental-prometheus-rw}
      K6_PROMETHEUS_RW_SERVER_URL: ${K6_PROMETHEUS_RW_SERVER_URL:-http://172.31.28.170:9290/api/v1/write}
      K6_PROMETHEUS_RW_TREND_STATS: ${K6_PROMETHEUS_RW_TREND_STATS:-p(95),p(99),max}
