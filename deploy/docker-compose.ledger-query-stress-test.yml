services:
  ledger-query-stress-test:
    build:
      context: ..
      dockerfile: stress-test/Dockerfile
    image: z-exchange/stress-test:local
    container_name: ledger-query-stress-test
    entrypoint: ["/run-query-stress.sh"]
    environment:
      LEDGER_GRPC_HOST: ${LEDGER_GRPC_HOST:-172.31.16.37}
      LEDGER_GRPC_PORT: ${LEDGER_GRPC_PORT:-9191}
      LEDGER_GRPC_DEADLINE_SECONDS: ${LEDGER_GRPC_DEADLINE_SECONDS:-5}
      LEDGER_QUERY_PROFILE: ${LEDGER_QUERY_PROFILE:-rpc-discovery}
      LEDGER_QUERY_LOOKUP: ${LEDGER_QUERY_LOOKUP:-txn-id}
      LEDGER_QUERY_RUN_ID: ${LEDGER_QUERY_RUN_ID:-}
      LEDGER_QUERY_FIXTURE_SIZE: ${LEDGER_QUERY_FIXTURE_SIZE:-10000}
      LEDGER_QUERY_WORKING_SET_SIZE: ${LEDGER_QUERY_WORKING_SET_SIZE:-1000}
      LEDGER_QUERY_WORKING_SET_START: ${LEDGER_QUERY_WORKING_SET_START:-100}
      LEDGER_QUERY_WORKING_SET_STEP: ${LEDGER_QUERY_WORKING_SET_STEP:-100}
      LEDGER_QUERY_WORKING_SET_STEPS: ${LEDGER_QUERY_WORKING_SET_STEPS:-8}
      LEDGER_QUERY_STAGE_SECONDS: ${LEDGER_QUERY_STAGE_SECONDS:-30}
      LEDGER_QUERY_WARM_RATE: ${LEDGER_QUERY_WARM_RATE:-5}
      LEDGER_QUERY_RATE: ${LEDGER_QUERY_RATE:-100}
      LEDGER_QUERY_RATE_STEP: ${LEDGER_QUERY_RATE_STEP:-25}
      LEDGER_QUERY_RATE_STEPS: ${LEDGER_QUERY_RATE_STEPS:-8}
      LEDGER_QUERY_SOAK_SECONDS: ${LEDGER_QUERY_SOAK_SECONDS:-120}
      LEDGER_QUERY_PREALLOCATED_VUS: ${LEDGER_QUERY_PREALLOCATED_VUS:-100}
      LEDGER_QUERY_MAX_VUS: ${LEDGER_QUERY_MAX_VUS:-500}
      LEDGER_QUERY_MISS_RATE_PERCENT: ${LEDGER_QUERY_MISS_RATE_PERCENT:-0}
      LEDGER_QUERY_MISS_CARDINALITY_PERCENT: ${LEDGER_QUERY_MISS_CARDINALITY_PERCENT:-10}
      LEDGER_QUERY_MISS_PATTERN: ${LEDGER_QUERY_MISS_PATTERN:-repeated}
      LEDGER_QUERY_MAX_UNEXPECTED_ERROR_RATE: ${LEDGER_QUERY_MAX_UNEXPECTED_ERROR_RATE:-}
      LEDGER_QUERY_MAX_P95_MS: ${LEDGER_QUERY_MAX_P95_MS:-}
      DB_HOST: ${INFRA_PRIVATE_IP:-172.31.18.211}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${LEDGER_DB_NAME:-trade_ledgerservice}
      DB_USERNAME: ${LEDGER_DB_USERNAME:-ledger}
      DB_PASSWORD: ${LEDGER_DB_PASSWORD:-ledger-local}
      DB_READY_ATTEMPTS: ${DB_READY_ATTEMPTS:-30}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
      K6_OUT: ${K6_OUT:-experimental-prometheus-rw}
      K6_PROMETHEUS_RW_SERVER_URL: ${K6_PROMETHEUS_RW_SERVER_URL:-http://172.31.28.170:9290/api/v1/write}
      K6_PROMETHEUS_RW_TREND_STATS: ${K6_PROMETHEUS_RW_TREND_STATS:-p(95),p(99),max}
