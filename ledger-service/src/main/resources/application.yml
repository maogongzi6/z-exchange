spring:
  application:
    name: ledger-service

  profiles:
    default: vmware

  datasource:
    url: "jdbc:mysql://localhost:3306/trade_ledgerservice?serverTimezone=GMT%2B8&characterEncoding=utf-8&useSSL=false"
    username: root
    password: "0000"
    driver-class-name: com.mysql.cj.jdbc.Driver

  cache:
    type: redis
  redis:
    port: 6379
  redisson:
    config: classpath:redisson.yml

  kafka:
    consumer:
      auto-offset-reset: latest
      fetch-min-size: 256
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer

    listener:
      ack-mode: manual
      type: single

    producer:
      compression-type: lz4
      retries: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

      properties:
        enable:
          idempotence: true


mybatis-plus:
  type-enums-package: com.exchange.app.ledger.po


server:
  port: 8081


grpc:
  server:
    port: 9191

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        zexchange.grpc.server.duration: true
        zexchange.ledger.processing.duration: true
        zexchange.kafka.listener.duration: true
        zexchange.kafka.publish.duration: true
        zexchange.outbox.dispatch.duration: true
        zexchange.redis.operation.duration: true
        zexchange.db.operation.duration: true
        zexchange.db.transaction.duration: true
      slo:
        zexchange.grpc.server.duration: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,3s
        zexchange.ledger.processing.duration: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,3s
        zexchange.kafka.listener.duration: 10ms,25ms,50ms,100ms,250ms,500ms,1s,3s,10s
        zexchange.kafka.publish.duration: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,3s
        zexchange.outbox.dispatch.duration: 10ms,25ms,50ms,100ms,250ms,500ms,1s,3s,10s,30s
        zexchange.redis.operation.duration: 1ms,2ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s
        zexchange.db.operation.duration: 1ms,2ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,3s
        zexchange.db.transaction.duration: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,3s,10s

app:
  db:
    query:
      default-batch-size: 3

  kafka:
    not-retriable-exceptions: com.exchange.common.exception.AbnormalProtoDataException
    listener:
      retry:
        attempts: 7
        reply-failure-after-attempts: 5
        base-attempt-interval-ms: 15000
        backoff-delay-ms: 1000
        backoff-multiplier: 1.0
        backoff-max-delay-ms: 25000
        auto-create-topics: false

  outbox:
    interval: "*/5 * * * * ?"
    page-limit: 2

  cache:
    idemp:
      pending-ttl: 120s
      done-ttl: 24h
      jitter-ms: 100
    data:
      entity-cache-ttl: 120s
      index-cache-ttl: 1h
      tombstone-ttl: 120s # should be short to only cover request ttl
      negative-ttl: 30s
      jitter: 100ms
