server:
  port: 10020

grpc:
  client:
    GLOBAL:
      enable-keep-alive: true
      negotiation-type: plaintext
    wallet-client:
      address: static://127.0.0.1:9092


spring:
  kafka:
    bootstrap-servers: 192.168.52.100:9092
    consumer:
      auto-offset-reset: latest

  cache:
    type: redis
  redis:
    host: 192.168.52.100
    port: 6379

    redisson:
      file: classpath:redisson.yml
      # OR (alternative) config: "singleServerConfig: ... (a long YAML string)"

#      spring:
#        cache:
#          type: redis
#        redis:
#          host: 127.0.0.1 # Redis服务器地址
#          database: 1 # Redis数据库索引（默认为0）
#          port: 6379 # Redis服务器连接端口
#          password: # Redis服务器连接密码（默认为空）