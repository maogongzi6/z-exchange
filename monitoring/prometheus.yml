global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "ledger-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["ledger-service:8081"]

  - job_name: "wallet-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["192.168.52.1:8082"]
