apiVersion: 1

providers:
  - name: zexchange
    orgId: 1
    folder: Z-Exchange
    folderUid: zexchange
    type: file
    disableDeletion: false
    allowUiUpdates: false
    # Polling is reliable for Docker bind mounts where file-watch events may be lost.
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
